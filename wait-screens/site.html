<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바른 배치 연구소</title>
<style>
@font-face{font-family:"Barun Drawing Korean";src:url("../fonts/NanumGothic-Regular.ttf") format("truetype");font-weight:400}
/* 바른 디자인 토큰 v5 뿌리 + 역할별 색 */
:root{
  --bg:#161A21; --stage:#10151D; --panel:#1C2330; --panel2:#222C3A; --edge:#344151; --line:#2A3442;
  --text:#E8EEF5; --body:#C3CCD7; --sub:#A6B4C5; --dim:#7F8C9C; --dark:#4E5A69;
  --mint:#A4E4CE; --teal:#70BFB8; --cyan:#75DDE8; --blue:#82AFFF; --steel:#8FB7CA;
  --ai:#CABBF1; --green:#79AD91; --warn:#F2CA89; --err:#E9A9AA; --hot:#FF727A;
  --sans:"Barun Drawing Korean","NanumGothic","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:Consolas,Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:12px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:fixed;left:0;top:0;width:1600px;height:var(--H,1000px);transform-origin:0 0;display:grid;grid-template-rows:44px minmax(0,1fr) 150px;gap:8px;padding:12px 14px}

/* 머리 */
.head{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.head h1{font:600 13px var(--mono);letter-spacing:.08em}
.head h1 small{display:block;color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.02em;margin-top:1px}
.cnt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cnt div{font:10px var(--mono);color:var(--dim);letter-spacing:.05em;border-bottom:1px solid var(--edge);padding-bottom:2px;white-space:nowrap;overflow:hidden}
.cnt b{display:block;color:var(--text);font:400 16px/1.2 var(--mono);letter-spacing:0}
.cnt .m b{color:var(--mint)} .cnt .c b{color:var(--cyan)}
.speed{display:flex;gap:4px;align-items:center;color:var(--dim);font:10.5px var(--mono)}
.speed button{all:unset;cursor:pointer;font:600 10.5px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.speed button.on{border-color:var(--cyan);color:var(--cyan)}

/* 무대 */
.hero{position:relative;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--stage)}
#hero{position:absolute;inset:0;width:100%;height:100%}
.htag{position:absolute;left:16px;top:12px;font:10px var(--mono);color:var(--dim);letter-spacing:.1em}
.site{position:absolute;left:16px;bottom:46px;font:11px var(--mono);color:var(--sub)}
.site b{color:var(--text);font-weight:600}
.res{position:absolute;right:14px;top:14px;bottom:52px;width:var(--resw,284px);padding:14px 16px;border-left:2px solid var(--edge);
  background:linear-gradient(180deg,rgba(34,44,58,.72),rgba(28,35,48,.45));border-radius:0 6px 6px 0;font:12px/1.55 var(--sans);color:var(--body);overflow:hidden;transition:border-color .2s}
.res.ok{border-left-color:var(--mint)} .res.ng{border-left-color:var(--err)} .res.zero{border-left-color:var(--warn)}
.res .tag{font:10.5px var(--mono);color:var(--dim);letter-spacing:.06em}
.res .badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 11px var(--mono);color:var(--sub)}
.res .badge i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.res.ok .badge i{background:var(--mint);box-shadow:0 0 8px var(--mint)} .res.ng .badge i{background:var(--hot);box-shadow:0 0 8px var(--hot)}
.res h3{font:700 15px/1.3 var(--sans);color:var(--text);margin-top:6px;letter-spacing:-.01em}
.res h3.ng{color:var(--err)} .res h3.ok{color:var(--mint)}
.res .sub{color:var(--sub);margin-top:3px}
.res .ev{display:inline-block;margin-top:8px;padding:2px 9px;border:1px solid var(--edge);color:var(--dim);border-radius:999px;font:11px var(--mono);transition:all .15s}
.res .ev.on{border-color:var(--warn);color:var(--warn)}
.res .nums{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res .nums div{color:var(--dim);font-size:10.5px;border-top:1px solid var(--edge);padding-top:5px}
.res .nums b{display:block;font:300 26px/1.1 var(--mono);color:var(--text)}
.res .nums b small{font-size:11px;color:var(--dim)}
.res .nums .bad b{color:var(--hot)} .res .nums .near b{color:var(--warn)}
.res ul{list-style:none;margin-top:10px}
.res li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res ul.wrap li{white-space:normal;margin-bottom:6px}
.res li.plain::before{content:none}
.res li::before{content:"✕ ";color:var(--hot)}
.res .why{margin-top:10px;color:var(--sub)}
.res .cmp{margin-top:10px;padding-top:8px;border-top:1px dashed var(--edge);font:11px var(--mono);color:var(--blue)}
.res .next{all:unset;cursor:pointer;margin-top:12px;display:inline-block;font:600 11px var(--mono);color:var(--text);border:1px solid var(--edge);border-radius:999px;padding:5px 12px}
.res .next small{color:var(--dim);font-weight:400}

/* 아래 8칸 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:6px;min-height:0}
/* 아래는 한 줄 4칸만(10-25 대표 시안 ⑱). 나머지 4칸은 결과가 나온 뒤 계획안 화면에서 본다 */
.grid .p.later{display:none}
.p{background:linear-gradient(180deg,var(--panel2),var(--panel) 40%);border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.p h2{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--text);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.p h2 em{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.p canvas{flex:1;min-height:0;width:100%}
.feed{flex:1;overflow:hidden;font:11px/15px var(--mono);color:var(--dim);display:flex;flex-direction:column;justify-content:flex-end}
.feed div{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .w{color:var(--text)}.feed .m{color:var(--mint)}.feed .c{color:var(--err)}.feed .y{color:var(--warn)}.feed .b{color:var(--cyan)}
table{width:100%;border-collapse:collapse;font:11px var(--mono);color:var(--body)}
th{color:var(--dim);font-weight:400;text-align:right;padding:1px 4px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:1.5px 4px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
td.ok{color:var(--mint)} td.ng{color:var(--hot)} td.nr{color:var(--warn)} td.dim{color:var(--dim)}
tr.hit td:first-child{color:var(--hot)}
.lane{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:0 6px;font:11px var(--mono);color:var(--body);margin-bottom:2px}
.lane span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
.lane span:nth-child(2){text-align:right;color:var(--text)}
.lane span:nth-child(2) small{color:var(--dim)}
.lane i{grid-column:1/3;height:3px;background:#141a22;display:block;position:relative;border-radius:2px;overflow:hidden}
.lane i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--err),var(--hot));transition:width .2s}
.lane.hit span:first-child{color:var(--hot)}

/* 좁은 창(통째 축소가 큰 경우): 기준판 글자를 키워 실제로 읽히게, 줄 수는 줄어듦 */
.compact .feed{font-size:17px;line-height:24px}
.compact table,.compact .lane{font-size:16px}
.compact .lane{grid-template-columns:minmax(0,1fr) 80px}
.compact .p h2{font-size:15px}.compact .p h2 em{display:none}
.compact .res{font-size:17px}.compact .res h3{font-size:20px}.compact .res .tag,.compact .res .badge,.compact .res .ev{font-size:15px}
.compact .res .nums b{font-size:32px}
.compact .cnt b{font-size:20px}.compact .cnt div{font-size:13px}
.compact .site{font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>BARUN SITE ENGINE / LAYOUT LAB<small id="sub"></small></h1>
    <div class="cnt" id="cnt"></div>
    <div class="speed">재생 <span id="speeds" style="display:flex;gap:4px"></span></div>
  </header>

  <section class="hero">
    <canvas id="hero"></canvas>
    <div class="site" id="site"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="grid">
    <div class="p"><h2>탐색 기록 <em id="feedTag"></em></h2><div class="feed" id="feed"></div></div>
    <div class="p"><h2>후보 분포 <em>건폐 × 용적 · <span style="color:var(--blue)">― 실제 준공</span></em></h2><canvas id="cScatter"></canvas></div>
    <div class="p later"><h2>후보 검증표 <em id="vTag"></em></h2><div id="verify"></div></div>
    <div class="p"><h2>평면 <em id="planTag"></em></h2><canvas id="cPlan"></canvas></div>
    <div class="p later"><h2>탈락 원인 <em>탈락 / 검사 · 재생 표본 · 중복 집계</em></h2><div id="lanes"></div></div>
    <div class="p later"><h2>용적률 추이 <em><span style="color:var(--mint)">― 최고 통과안</span> · <span style="color:var(--blue)">― 준공</span></em></h2><canvas id="cTrace"></canvas></div>
    <div class="p later"><h2>배치 방식 비교 <em>재생 표본</em></h2><div id="mix"></div></div>
    <div class="p"><h2>대지 조건 <em id="siteTag"></em></h2><div id="siteInfo"></div></div>
  </section>
</div>

<script src="site_example.js"></script>
<script>
// 예시 기록(site_example.js)은 설치판에 싣지 않는다. 없으면 기록 재생을 시작하지 않고 site-wait-frame.js 가 실제 값과 '계산 중'만 보인다.
if (!window.ENGINE_RUN) {
  // 기록 재생은 멈추되 판 크기는 맞춘다. 안 맞추면 1600px 판 그대로 왼쪽 위만 보인다(맥 설치판 빈 화면, 10-24). 아래 fitApp 과 같은 계산.
  const fitOnly = () => { const W = Math.max(1000, Math.min(1600, innerWidth)), H = W * innerHeight / innerWidth, app = document.querySelector(".app"), s = innerWidth / W;
    document.body.classList.toggle("compact", innerWidth < 1000); app.style.width = W + "px"; app.style.setProperty("--H", H + "px");
    app.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; };
  fitOnly(); addEventListener("resize", fitOnly);
  throw new Error("예시 기록 없음 · 실제 값만 표시");
}
const D = window.ENGINE_RUN, IT =D.items.filter(i => i.cands || i.n_cand === 0);
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => v == null ? "–" : (+v).toFixed(d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAL = {mint: "#A4E4CE", teal: "#70BFB8", cyan: "#75DDE8", blue: "#82AFFF", steel: "#8FB7CA", ai: "#CABBF1", green: "#79AD91", warn: "#F2CA89", err: "#E9A9AA", hot: "#FF727A", text: "#E8EEF5", glow: "#28465A"};
const K = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, hex(v)]));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const pad4 = n => String(n).padStart(4, "0");
const short = (s, n = 22) => s && s.length > n ? s.slice(0, n) + "…" : (s || "");
function bbox(pts) { let a = [1e9, 1e9, -1e9, -1e9]; pts.forEach(([x, y]) => { a = [Math.min(a[0], x), Math.min(a[1], y), Math.max(a[2], x), Math.max(a[3], y)]; }); return a; }
const centroid = pts => { const b = bbox(pts); return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]; };
// 규칙 표시 이름(엔진 내부 이름 → 짧은 말)
const NAMES = [[/요청 전용면적 수용\(코어 차감\)/, "전용면적 확보(코어 차감)"], [/요청 전용면적 수용\(공용 0/, "전용면적 확보(공용 0)"], [/^차로 너비/, "차로 폭"], [/구획별 앞쪽 차로/, "구획 앞 차로 연결"],
  [/주차대수/, "주차 대수"], [/코어 배치/, "코어 배치"], [/코어 승강기/, "승강기 필요"], [/도시형 탐색 종류/, "주택 종류 일치"], [/요청 세대수/, "세대수 수용"], [/90° 미만 모서리/, "예각 모서리 없음"],
  [/^(\d+)F 건축가능영역/, "$1층 건축선 안"], [/^건폐율/, "건폐율"], [/^용적률/, "용적률"], [/^이격 (.+)/, "이격 $1"]];
const nm = r => { for (const [re, t] of NAMES) if (re.test(r)) return r.replace(re, t).replace(/\(.*$/, m => m.length > 12 ? "" : m); return short(r.replace(/\(.*?\)/g, "").trim(), 16); };

let SPEED = 1;
const RATE = 6;
$("sub").textContent = `${D.started} · engine ${D.engine} · 부산 실제 준공 필지 · 후보 도형·규칙은 엔진 실행 기록 재생`;
$("speeds").innerHTML = [1, 2, 4].map(v => `<button data-v="${v}">${v}×</button>`).join("");
$("speeds").querySelectorAll("button").forEach(b => b.onclick = () => { SPEED = +b.dataset.v; $("speeds").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
$("speeds").firstChild.classList.add("on");

/* ---------- 대지 조건(땅 하나) ---------- */
function paintSite() {
  const it = S.it, sun = /주거/.test(it.zone || ""), fin = S.phase === "final", ok = it.status === "ok";
  const row = (k, v, cls = "") => `<tr><td>${k}</td><td class="${cls}" style="text-align:right">${v}</td></tr>`;
  $("siteInfo").innerHTML = `<table>
    ${row("대지 면적", `${fmt(it.site)}㎡`)}
    ${row("용도지역", it.zone || "–")}
    ${row("허용 건폐 · 용적", `${fmt(it.bcr_max, 0)}% · ${fmt(it.far_max, 0)}%`)}
    ${row("접도 · 붙은 도로", `${fmt(it.road)}m · ${(it.roads || []).length}곳`)}
    ${row("정북 일조 사선", sun ? "적용(주거지역)" : "해당 없음", sun ? "nr" : "dim")}
    ${row("엔진 결과", fin ? (ok ? `${it.floors}층 · 용적 ${fmt(it.far)}%` : "선택안 없음") : "검토 중", fin ? (ok ? "ok" : "ng") : "dim")}
    ${row("실제 준공", `${it.built_floors ?? "—"}층 · 용적 ${fmt(it.built_far)}%`, "")}
  </table>`;
  $("siteTag").textContent = `${it.id} · ${it.gu || ""}`;
}

/* ---------- 단계: 법규 → 대지 분석 → 건축가능영역 → 목표 → 후보 탐색 → 선택 → 결과 ---------- */
const PH = [["law", "법규 검토", 2.8], ["site", "대지 분석", 2.6], ["env", "건축가능영역", 2.8], ["target", "목표·주차", 1.8], ["run", "후보 탐색", 0], ["pick", "선택", 1.8], ["final", "결과", 0]];
const PHI = Object.fromEntries(PH.map((p, i) => [p[0], i]));
const ringArea = r => { let a = 0; for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1]; return Math.abs(a) / 2; };
function drawPhaseStrip() {
  let x = MODEL.x; const y = 50, cur = PHI[S.phase];
  PH.forEach(([id, name], i) => {
    const done = i < cur, on = i === cur, t = `${"①②③④⑤⑥⑦"[i]} ${name}`;
    g.font = `${on ? 600 : 400} 12px 'Barun Drawing Korean', sans-serif`; const w = g.measureText(t).width;
    if (on) { g.fillStyle = rgba(K.cyan, .16); g.fillRect(x - 6, y - 14, w + 12, 20); g.fillStyle = rgba(K.cyan, 1); g.fillRect(x - 6, y + 5, (w + 12) * (S.phase === "run" ? Math.max(0, S.k + 1) / Math.max(1, S.list.length) : S.phase === "final" ? 1 : clamp(S.pt / (PH[i][2] || 1), 0, 1)), 2); }
    g.fillStyle = on ? rgba(K.text, 1) : done ? rgba(K.mint, .9) : rgba(K.steel, .45); g.fillText(t, x, y);
    x += w + 22; if (i < PH.length - 1) { g.fillStyle = rgba(K.steel, .35); g.fillText("→", x - 16, y); }
  });
}
let preAt = -1;
function drawPre() {
  const it = S.it, A = S.an, p = clamp(S.pt / PH[PHI[S.phase]][2], 0, 1);
  if (S.phase === "law") {
    const y = MODEL.y + MODEL.h * (.15 + .7 * ((S.pt * 1.3) % 1)); g.strokeStyle = rgba(K.cyan, .5); g.beginPath(); g.moveTo(MODEL.x, y); g.lineTo(MODEL.x + MODEL.w, y); g.stroke();
    const n = Math.floor(p * S.rules.length); while (S.lawN < n) { const r = S.rules[S.lawN++]; feed(`  <span class="b">·</span> 적용 규칙 · ${r}`); }
  } else if (S.phase === "site" || S.phase === "env" || S.phase === "target") {
    const E = A.edges || [], n = S.phase === "site" ? Math.ceil(p * E.length) : E.length;
    E.slice(0, n).forEach((e, i) => {
      const col = e.kind === "road" ? K.cyan : e.north ? K.warn : K.steel, a = P(...e.p0), b = P(...e.p1);
      g.save(); g.strokeStyle = rgba(col, 1); g.lineWidth = e.kind === "road" ? 4 : 2; g.shadowColor = rgba(col, .8); g.shadowBlur = 8; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); g.restore();
      if (S.phase === "site") { const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], t = e.kind === "road" ? `도로 ${fmt(e.w)}m · ${fmt(e.len)}m` : e.north ? `정북 ${fmt(e.len)}m` : `인접 ${fmt(e.len)}m`;
        g.font = "600 11px Consolas, Menlo, monospace"; const w = g.measureText(t).width + 10; g.fillStyle = "rgba(22,26,33,.88)"; g.fillRect(m[0] - w / 2, m[1] - 22, w, 17); g.fillStyle = rgba(col, 1); g.fillText(t, m[0] - w / 2 + 5, m[1] - 9); }
    });
    if (A.site_eff && (S.phase !== "site" || p > .7)) { path(g, A.site_eff); g.save(); g.setLineDash([5, 4]); g.strokeStyle = rgba(K.mint, .9); g.lineWidth = 1.4; g.stroke(); g.restore(); g.fillStyle = rgba(K.mint, .05); g.fill(); }
    if (S.phase !== "site") {
      const F = (A.floors || []).filter(Boolean), m = S.phase === "env" ? Math.ceil(easeOut(p) * F.length) : F.length;
      F.slice(0, m).forEach((r, i) => { const z = i * 3, a = S.phase === "target" ? .45 : 1;
        r.forEach(v => { g.strokeStyle = rgba(K.mint, .25 * a); g.beginPath(); g.moveTo(...P(...v, z)); g.lineTo(...P(...v, z + 3)); g.stroke(); });
        path(g, r, z + 3); g.fillStyle = rgba(K.mint, .06 * a); g.fill(); g.strokeStyle = rgba(K.mint, .8 * a); g.lineWidth = 1.1; g.stroke();

/* ---------- 상태 ---------- */
const S = {si: -1};

  Object.assign(S, {si, it, list: C ? C.sample : [], k: -1, kf: 0, t: 0, phase: "run", fin: 0, ghosts: [], trail: [], tape: [], laneCnt: {}, laneChk: {}, shownOk: 0,
    seenWhy: new Set(), best: null, pulses: [], probes: [], probeAt: 0, mix: {}, cur: null, ev: null, evAt: -9, farMax: (it.far_max || 100) * 1.25});
  const [x0, y0, x1, y1] = bbox(it.parcel);
  S.c = [(x0 + x1) / 2, (y0 + y1) / 2]; S.w = x1 - x0; S.h = y1 - y0; S.span = Math.max(S.w, S.h, 8);
  const maxF = Math.ceil((it.far_max || 200) / Math.max(10, it.bcr_max || 60)) + 1;

  S.maxH = Math.min(S.span * 1.5, (fMax || maxF) * 3);

  if (S.an && S.an.edges) S.phase = "law";
  $("site").innerHTML = `<b>${it.id}</b> · ${it.gu || ""} · ${it.zone || ""} · 대지 ${fmt(it.site)}㎡ · 접도 ${fmt(it.road)}m · ${it.use || ""}`;
  $("feed").innerHTML = "";
  feed(`<span class="w">▸ ${it.id}</span> 필지 조건 · ${fmt(it.site)}㎡ · ${it.zone} · 건폐 ≤${fmt(it.bcr_max, 0)}% · 용적 ≤${fmt(it.far_max, 0)}%`);
  if (S.phase === "law") feed(`<span class="w">① 법규 검토</span> · ${it.zone} · 건폐 ≤${fmt(it.bcr_max, 0)}% · 용적 ≤${fmt(it.far_max, 0)}% · 규칙 ${S.rules.length}개`);
  feed(it.n_cand ? `  <span class="b">후보 배치</span> · 엔진 후보 ${it.n_cand.toLocaleString()}개 중 ${S.list.length}개 실제 도형 재생` : `  <span class="y">후보 생성 0건</span> · 기록된 제외 사유 확인`);

/* ---------- 투영 ---------- */
const theta = .6, cam = {s: 1, ox: 0, oy: 0};
function P(x, y, z = 0) {

  return [cam.ox + (dx * c - dy * s) * cam.s, cam.oy - (dx * s + dy * c) * cam.s * .55 - z * cam.s * .8];

const depth = (x, y) => { const dx = x - S.c[0], dy = y - S.c[1]; return dx * Math.sin(theta) + dy * Math.cos(theta); };

/* ---------- 캔버스·배치 ---------- */
const hero = $("hero"), g = hero.getContext("2d");
let HW = 0, HH = 0, ARCW = 330, RESW = 316, MODEL = {x: 0, y: 0, w: 0, h: 0};
let SCALE = 1;
function fitApp() {
  // 창 비율에 맞춰 기준판 높이 900~1000, 그다음 통째로 맞춤(스크롤 없음)
  const W = Math.max(1000, Math.min(1600, innerWidth)), H = W * innerHeight / innerWidth, app = document.querySelector(".app");
  SCALE = innerWidth / W;
  document.body.classList.toggle("compact", innerWidth < 1000);
  app.style.width = W + "px";
  app.style.setProperty("--H", H + "px");
  app.style.transform = `translate(${(innerWidth - W * SCALE) / 2}px,${(innerHeight - H * SCALE) / 2}px) scale(${SCALE})`;
}
function fitCanvas(cv) { const r = (devicePixelRatio || 1) * Math.max(SCALE, .5), w = cv.clientWidth, h = cv.clientHeight; cv.width = Math.max(1, w * r); cv.height = Math.max(1, h * r); cv.getContext("2d").setTransform(r, 0, 0, r, 0, 0); return [w, h]; }
let pendingResize = false;
function resize() {
  if(document.hidden || PAUSED){pendingResize=true;return;}pendingResize=false;
  [HW, HH] = fitCanvas(hero); ["cScatter", "cPlan", "cTrace"].forEach(id => fitCanvas($(id)));
  if (!S.it) return;
  ARCW = 250; RESW = parseFloat(getComputedStyle($("res")).width) || 316;
  MODEL = {x: ARCW + 20, y: 20, w: HW - ARCW - RESW - 48, h: HH - 20 - 52};
  const pts = []; S.it.parcel.forEach(([x, y]) => { pts.push([x, y, 0], [x, y, S.maxH]); });
  const c = Math.cos(theta), s = Math.sin(theta); let a = [1e9, 1e9, -1e9, -1e9];
  pts.forEach(([x, y, z]) => { const dx = x - S.c[0], dy = y - S.c[1], X = dx * c - dy * s, Y = -(dx * s + dy * c) * .55 - z * .8; a = [Math.min(a[0], X), Math.min(a[1], Y), Math.max(a[2], X), Math.max(a[3], Y)]; });
  cam.s = Math.min(MODEL.w * .9 / (a[2] - a[0] || 1), MODEL.h * .9 / (a[3] - a[1] || 1));
  cam.ox = MODEL.x + MODEL.w / 2 - (a[0] + a[2]) / 2 * cam.s; cam.oy = MODEL.y + MODEL.h / 2 - (a[1] + a[3]) / 2 * cam.s;
  drawScatter(); drawTrace(); drawPlan();
}
addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(() => { fitApp(); resize(); }, 100); });

/* ---------- 위반 위치: 숫자로 확인되는 것만 ---------- */
function hits(c) {
  const it = S.it;
  return {fp: (c.bcr != null && it.bcr_max != null && c.bcr > it.bcr_max + 1e-6) || (c.far != null && it.far_max != null && c.far > it.far_max + 1e-6),

/* ---------- 후보 하나 ---------- */
function advance() {
  S.k++;
  const c = S.list[S.k], ok = c.s === -1;
  if (S.cur) { S.trail.push({c: S.cur, at: T}); if (S.trail.length > 3) S.trail.shift(); }
  S.cur = c; S.t = 0; S.revealed = false;
  if (ok) { S.shownOk++; S.ghosts.push(c); }
  (c.c || []).forEach(([r, o]) => { S.laneChk[r] = (S.laneChk[r] || 0) + 1; if (!o) S.laneCnt[r] = (S.laneCnt[r] || 0) + 1; });
  const key = `${c.m || "?"}·${c.sh || "?"}`; S.mix[key] = S.mix[key] || {n: 0, ok: 0, far: 0}; S.mix[key].n++; if (ok) { S.mix[key].ok++; S.mix[key].far = Math.max(S.mix[key].far, c.far || 0); }
  S.farMax = Math.max(S.farMax, (c.far || 0) * 1.08);

  if (ev) { S.ev = `#${pad4(c.q)} · ${ev}`; S.evAt = RT; }

  S.pulses.push({k: S.k, born: T, ok, strands: Array.from({length: 7}, (_, j) => ({dy: (j / 6 - .5) * 40, delay: Math.random() * .1, jit: Math.random() - .5}))});
  if (S.pulses.length > 10) S.pulses.shift();
  feed(`<span class="n">${pad4(c.q)}</span> ${c.f ?? "–"}F ${c.m || ""}/${c.sh || ""} · 용적 ${fmt(c.far, 0)} · ${ok ? '<span class="m">✓ 통과</span>' : `<span class="c">✕ ${nm(c.x[0])}</span>`}${ev ? ` <span class="y">· ${ev}</span>` : ""}`);

}

  $("lanes").innerHTML = top.map(([r, v]) => `<div class="lane ${hit.includes(r) ? "hit" : ""}"><span title="${r}">${nm(r)}</span><span>${v}<small>/${S.laneChk[r] || 0}</small></span><i><b style="width:${v / mx * 100}%"></b></i></div>`).join("")
    || `<div class="lane"><span style="color:var(--dim)">${S.it && S.it.n_cand === 0 ? "후보가 없어 규칙 검사 없음" : "아직 탈락 없음"}</span><span></span></div>`;
}
function sub(id) { const cv = $(id), w = cv.clientWidth, h = cv.clientHeight, c = cv.getContext("2d"); c.clearRect(0, 0, w, h); return [w, h, c]; }
function zeroNote(c, w, h) { c.fillStyle = "#A6B4C5"; c.font = "12px Consolas, Menlo, monospace"; c.fillText("후보 생성 0건 → 분포 없음", 10, h / 2); }
function drawScatter() {
  if (!S.it) return; const [w, h, c] = sub("cScatter"), it = S.it;
  if (!it.n_cand) return zeroNote(c, w, h);
  const bm = (it.bcr_max || 60) * 1.4, fm = Math.max((it.far_max || 200) * 1.4, (it.built_far || 0) * 1.1), pad = 26;
  const X = v => pad + clamp(v / bm, 0, 1) * (w - pad - 6), Y = v => h - 14 - clamp(v / fm, 0, 1) * (h - 20);
  const gr = c.createLinearGradient(0, Y(it.far_max), 0, Y(0)); gr.addColorStop(0, rgba(K.mint, .1)); gr.addColorStop(1, rgba(K.cyan, .03));
  c.fillStyle = gr; c.fillRect(X(0), Y(it.far_max), X(it.bcr_max) - X(0), Y(0) - Y(it.far_max));
  c.strokeStyle = "#344151"; c.beginPath(); c.moveTo(pad, 4); c.lineTo(pad, h - 14); c.lineTo(w - 4, h - 14); c.stroke();
  c.fillStyle = "#7F8C9C"; c.font = "10px Consolas, Menlo, monospace";
  c.fillText(`${fmt(it.bcr_max, 0)}%`, X(it.bcr_max) - 12, h - 3); c.fillText(`${fmt(it.far_max, 0)}`, 0, Y(it.far_max) + 3);
  if (it.built_far != null) { c.strokeStyle = rgba(K.blue, .8); c.setLineDash([4, 3]); c.beginPath(); c.moveTo(pad, Y(it.built_far)); c.lineTo(w - 4, Y(it.built_far)); c.stroke(); c.setLineDash([]); }
  const agg = {};
  S.list.forEach((q, k) => { if (k > S.k) return; const key = `${Math.round(q.bcr || 0)}|${Math.round(q.far || 0)}|${q.s === -1}`; agg[key] = agg[key] || {q, n: 0}; agg[key].n++; });
  Object.values(agg).forEach(({q, n}) => { const ok = q.s === -1; c.fillStyle = rgba(ok ? K.mint : K.hot, .6); c.beginPath(); c.arc(X(q.bcr || 0), Y(q.far || 0), 1.6 + Math.sqrt(n), 0, 6.29); c.fill(); });
  const mark = S.phase === "final" ? S.list[S.selIdx] : S.cur;
  if (mark) { const x = X(mark.bcr || 0), y = Y(mark.far || 0); c.strokeStyle = rgba(K.text, .95); c.lineWidth = 1.3; c.beginPath();
    if (S.phase === "final") { c.moveTo(x, y - 6); c.lineTo(x + 6, y); c.lineTo(x, y + 6); c.lineTo(x - 6, y); c.closePath(); } else c.arc(x, y, 5, 0, 6.29); c.stroke(); }
}
function drawTrace() {
  if (!S.it) return; if (!S.it.n_cand) { const [w, h, c] = sub("cTrace"); return zeroNote(c, w, h); } const [w, h, c] = sub("cTrace"), L = S.list, it = S.it, n = Math.max(1, L.length - 1), fm = Math.max(S.farMax, (it.built_far || 0) * 1.1);
  const X = k => 26 + k / n * (w - 30), Y = v => h - 6 - clamp(v / fm, 0, 1) * (h - 14);
  c.fillStyle = "#7F8C9C"; c.font = "10px Consolas, Menlo, monospace"; c.fillText(`${fmt(it.far_max, 0)}`, 0, Y(it.far_max) + 3);
  c.strokeStyle = "#344151"; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(26, Y(it.far_max)); c.lineTo(w, Y(it.far_max)); c.stroke(); c.setLineDash([]);
  if (it.built_far != null) { c.strokeStyle = rgba(K.blue, .8); c.setLineDash([4, 3]); c.beginPath(); c.moveTo(26, Y(it.built_far)); c.lineTo(w, Y(it.built_far)); c.stroke(); c.setLineDash([]); }
  L.forEach((q, k) => { if (k > S.k) return; const ok = q.s === -1; c.fillStyle = rgba(ok ? K.mint : K.hot, ok ? .9 : .45); c.fillRect(X(k) - 1, Y(q.far || 0) - 1, 2, 2); });
  // 지금까지 통과안 최고 용적(계단선)
  let best = null; c.strokeStyle = rgba(K.mint, .95); c.lineWidth = 1.4; c.beginPath(); let started = false;
  L.forEach((q, k) => { if (k > S.k) return; if (q.s === -1 && (!best || q.far > best)) best = q.far; if (best == null) return; const x = X(k), y = Y(best); if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y); });
  c.stroke(); c.lineWidth = 1;
  if (best != null) { c.fillStyle = rgba(K.mint, 1); c.fillText(`${fmt(best)}%`, Math.min(w - 40, X(Math.max(0, S.k)) + 4), Y(best) - 4); }
}
function mixTable() {
  if (!S.it) return;
  const e = Object.entries(S.mix).sort((a, b) => b[1].n - a[1].n);
  const top = e.slice(0, 5), rest = e.slice(5).reduce((s, [, v]) => ({n: s.n + v.n, ok: s.ok + v.ok}), {n: 0, ok: 0});
  $("mix").innerHTML = `<table><tr><th>방식</th><th>검토</th><th>통과율</th><th>최고 용적</th></tr>${top.map(([k, v]) => `<tr><td>${k}</td><td>${v.n}</td><td class="${v.ok ? "ok" : "dim"}">${Math.round(v.ok / v.n * 100)}%</td><td class="${v.ok ? "ok" : "dim"}">${v.ok ? fmt(v.far) + "%" : "–"}</td></tr>`).join("")}${rest.n ? `<tr><td class="dim">그 밖</td><td>${rest.n}</td><td class="dim">${Math.round(rest.ok / rest.n * 100)}%</td><td></td></tr>` : ""}</table>`
    + (e.length ? "" : `<div style="color:var(--dim);font:11px var(--mono)">${S.it.n_cand ? "후보를 기다리는 중" : "후보 없음"}</div>`);
}
function drawPlan() {
  if (!S.it) return; const [w, h, c] = sub("cPlan"), it = S.it, fin = S.phase === "final";
  const q = fin ? (it.fp ? Object.assign({}, S.list[S.selIdx] || {}, {fp: it.fp}) : null) : S.cur;
  const [x0, y0, x1, y1] = bbox(it.parcel), s = Math.min((w - 20) / (x1 - x0 || 1), (h - 16) / (y1 - y0 || 1)), ox = (w - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
  const Tp = pts => { c.beginPath(); pts.forEach(([x, y], k) => { const X = ox + (x - x0) * s, Y = oy + (y1 - y) * s; k ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); };
  const TP = ([x, y]) => [ox + (x - x0) * s, oy + (y1 - y) * s];
  (it.roads || []).forEach(r => { Tp(r); c.fillStyle = rgba(K.blue, .06); c.fill(); });
  Tp(it.parcel); c.strokeStyle = rgba(K.text, .8); c.lineWidth = 1; c.setLineDash([4, 2]); c.stroke(); c.setLineDash([]);
  if (!q) { $("planTag").textContent = ""; return; }
  const ok = fin ? it.status === "ok" : q.s === -1, hx = ok ? {} : hits(q);
  (q.land || []).forEach(p => { Tp(p); c.fillStyle = rgba(K.green, .25); c.fill(); });
  if (q.strip) { Tp(q.strip); c.fillStyle = rgba(K.steel, .1); c.fill(); }
  (q.st || []).forEach(p => { Tp(p); c.strokeStyle = hx.stalls ? rgba(K.hot, .95) : rgba(K.cyan, .8); c.lineWidth = hx.stalls ? 1.6 : .8; c.stroke(); });
  if (q.fp) { Tp(q.fp); c.fillStyle = rgba(ok ? K.mint : K.steel, ok ? .22 : .12); c.fill(); c.strokeStyle = hx.fp ? rgba(K.hot, .95) : rgba(ok ? K.mint : K.steel, .95); c.lineWidth = 1.3; c.stroke(); }
  if (q.hall) { Tp(q.hall); c.fillStyle = rgba(K.ai, .2); c.fill(); }
  if (q.stair) { Tp(q.stair); c.fillStyle = rgba(K.ai, .55); c.fill(); }
  if (q.core) { Tp(q.core); c.strokeStyle = rgba(K.ai, .9); c.lineWidth = 1; c.stroke(); }
  // 위반 번호 표식(검증표와 같은 순서: 이격)
  let no = 1;
  (q.cl || []).forEach(([x, y, d, r, o]) => { if (o || x == null) return; const [X, Y] = TP([x, y]); c.fillStyle = rgba(K.hot, 1); c.beginPath(); c.arc(X, Y, 6, 0, 6.29); c.fill(); c.fillStyle = "#161A21"; c.font = "600 9px Consolas, Menlo, monospace"; c.fillText(String(no++), X - 3, Y + 3); });
  $("planTag").textContent = (fin ? (ok ? "엔진 선택안" : `미충족 기록안 #${pad4(q.q || 0)}`) : `#${pad4(q.q)}`) + " · 건물 · 코어 · 주차 · 차로 · 조경";
}

// 장면 바로 가기(점검·화면 캡처용): ?site=BR-0032&k=60 · ?site=BR-0032&fin=1
const Q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  fitApp();
  const si = Math.max(0, IT.findIndex(i => i.id === Q.get("site")));
  startSite(si);
  const ph = Q.get("ph"); if (ph && PHI[ph] != null && ph !== "final") { S.phase = ph; S.pt = +Q.get("t") || 0; }
  const k = +Q.get("k") || 0; if (k) S.phase = "run";
  for (let j = 0; j < Math.min(k, S.list.length); j++) { advance(); S.kf = S.k; }
  if (S.cur) S.t = .5 / RATE;
  if (Q.get("fin")) S.phase = "run";
  if (Q.get("fin") && S.phase === "run") { while (S.k + 1 < S.list.length) advance(); S.kf = S.k; finishSite(); }
  if (Q.get("fin")) { S.fin = 2; S.finRT = -2; }
  if (S.phase !== "final" || S.fin < 1) scheduleFrame();
});

/* ---------- 캐드에서 끼워 쓰기: 조종 메시지 · 진행 알림 ----------
   iframe.contentWindow.postMessage({target: "barun-wait", cmd: "pause"|"resume"|"restart"|"speed", value}, "*")
   알림: window.parent 로 {source: "barun-wait", kind: "site", event: "phase"|"done", ...} */
let PAUSED = false, _lastPhase = "";
function post(ev, extra = {}) { try { if (parent !== window) parent.postMessage({source: "barun-wait", kind: "site", event: ev, ...extra}, "*"); } catch (e) {} }
addEventListener("visibilitychange",()=>{if(document.hidden)stopFrame();else {if(pendingResize){fitApp();resize();}scheduleFrame();}});
addEventListener("message", ev => {
 if(ev.source!==parent || ev.origin!==location.origin)return;
 const m=ev.data||{};if(m.target!=="barun-wait")return;
 if(m.cmd==="pause"){PAUSED=true;stopFrame();}
 if(m.cmd==="resume"){PAUSED=false;if(pendingResize){fitApp();resize();}scheduleFrame();}
 if(m.cmd==="speed" && [1,2,4].includes(m.value))SPEED=m.value;
 if(m.cmd==="restart"){startSite(S.si);scheduleFrame();}
});
if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
</script>
