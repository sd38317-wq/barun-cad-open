<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바른 아파트 배치 연구소</title>
<style>
@font-face{font-family:"Barun Drawing Korean";src:url("../fonts/NanumGothic-Regular.ttf") format("truetype");font-weight:400}
/* 바른 디자인 토큰 v5 뿌리 + 역할별 색 */
:root{
  --bg:#161A21; --stage:#10151D; --panel:#1C2330; --panel2:#222C3A; --edge:#344151; --line:#2A3442;
  --text:#E8EEF5; --body:#C3CCD7; --sub:#A6B4C5; --dim:#7F8C9C; --dark:#4E5A69;
  --mint:#A4E4CE; --teal:#70BFB8; --cyan:#75DDE8; --blue:#82AFFF; --steel:#8FB7CA;
  --ai:#CABBF1; --green:#79AD91; --warn:#F2CA89; --err:#E9A9AA; --hot:#FF727A;
  --sans:"Barun Drawing Korean","NanumGothic","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:Consolas,Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:12px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:fixed;left:0;top:0;width:1600px;height:var(--H,1000px);transform-origin:0 0;display:grid;grid-template-rows:44px minmax(0,1fr) 330px;gap:8px;padding:12px 14px}

/* 머리 */
.head{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.head h1{font:600 13px var(--mono);letter-spacing:.08em}
.head h1 small{display:block;color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.02em;margin-top:1px}
.cnt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cnt div{font:10px var(--mono);color:var(--dim);letter-spacing:.05em;border-bottom:1px solid var(--edge);padding-bottom:2px;white-space:nowrap;overflow:hidden}
.cnt b{display:block;color:var(--text);font:400 16px/1.2 var(--mono);letter-spacing:0}
.cnt .m b{color:var(--mint)} .cnt .c b{color:var(--cyan)}
.speed{display:flex;gap:4px;align-items:center;color:var(--dim);font:10.5px var(--mono)}
.speed button{all:unset;cursor:pointer;font:600 10.5px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.speed button.on{border-color:var(--cyan);color:var(--cyan)}

/* 무대 */
.hero{position:relative;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--stage)}
#hero{position:absolute;inset:0;width:100%;height:100%}
.htag{position:absolute;left:16px;top:12px;font:10px var(--mono);color:var(--dim);letter-spacing:.1em}
.site{position:absolute;left:16px;bottom:46px;font:11px var(--mono);color:var(--sub)}
.site b{color:var(--text);font-weight:600}
.res{position:absolute;right:14px;top:14px;bottom:52px;width:var(--resw,284px);padding:14px 16px;border-left:2px solid var(--edge);
  background:linear-gradient(180deg,rgba(34,44,58,.72),rgba(28,35,48,.45));border-radius:0 6px 6px 0;font:12px/1.55 var(--sans);color:var(--body);overflow:hidden;transition:border-color .2s}
.res.ok{border-left-color:var(--mint)} .res.ng{border-left-color:var(--err)} .res.zero{border-left-color:var(--warn)}
.res .tag{font:10.5px var(--mono);color:var(--dim);letter-spacing:.06em}
.res .badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 11px var(--mono);color:var(--sub)}
.res .badge i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.res.ok .badge i{background:var(--mint);box-shadow:0 0 8px var(--mint)} .res.ng .badge i{background:var(--hot);box-shadow:0 0 8px var(--hot)}
.res h3{font:700 22px/1.25 var(--sans);color:var(--text);margin-top:6px;letter-spacing:-.01em}
.res h3.ng{color:var(--err)} .res h3.ok{color:var(--mint)}
.res .sub{color:var(--sub);margin-top:3px}
.res .ev{display:inline-block;margin-top:8px;padding:2px 9px;border:1px solid var(--edge);color:var(--dim);border-radius:999px;font:11px var(--mono);transition:all .15s}
.res .ev.on{border-color:var(--warn);color:var(--warn)}
.res .nums{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res .nums div{color:var(--dim);font-size:10.5px;border-top:1px solid var(--edge);padding-top:5px}
.res .nums b{display:block;font:300 26px/1.1 var(--mono);color:var(--text)}
.res .nums b small{font-size:11px;color:var(--dim)}
.res .nums .bad b{color:var(--hot)} .res .nums .near b{color:var(--warn)}
.res ul{list-style:none;margin-top:10px}
.res li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res ul.wrap li{white-space:normal;margin-bottom:6px}
.res li.plain::before{content:none}
.res li::before{content:"✕ ";color:var(--hot)}
.res .why{margin-top:10px;color:var(--sub)}
.res .cmp{margin-top:10px;padding-top:8px;border-top:1px dashed var(--edge);font:11px var(--mono);color:var(--blue)}
.res .next{all:unset;cursor:pointer;margin-top:12px;display:inline-block;font:600 11px var(--mono);color:var(--text);border:1px solid var(--edge);border-radius:999px;padding:5px 12px}
.res .next small{color:var(--dim);font-weight:400}

/* 아래 8칸 */
.grid{display:grid;grid-template-columns:414fr 370fr 370fr 400fr;grid-template-rows:1fr 1fr;gap:6px;min-height:0}
.p{background:linear-gradient(180deg,var(--panel2),var(--panel) 40%);border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.p h2{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--text);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.p h2 em{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.p canvas{flex:1;min-height:0;width:100%}
.feed{flex:1;overflow:hidden;font:11px/15px var(--mono);color:var(--dim);display:flex;flex-direction:column;justify-content:flex-end}
.feed div{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .w{color:var(--text)}.feed .m{color:var(--mint)}.feed .c{color:var(--err)}.feed .y{color:var(--warn)}.feed .b{color:var(--cyan)}
table{width:100%;border-collapse:collapse;font:11px var(--mono);color:var(--body)}
th{color:var(--dim);font-weight:400;text-align:right;padding:1px 4px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:1.5px 4px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
td.ok{color:var(--mint)} td.ng{color:var(--hot)} td.nr{color:var(--warn)} td.dim{color:var(--dim)}
tr.hit td:first-child{color:var(--hot)}
.lane{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:0 6px;font:11px var(--mono);color:var(--body);margin-bottom:2px}
.lane span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
.lane span:nth-child(2){text-align:right;color:var(--text)}
.lane span:nth-child(2) small{color:var(--dim)}
.lane i{grid-column:1/3;height:3px;background:#141a22;display:block;position:relative;border-radius:2px;overflow:hidden}
.lane i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--err),var(--hot));transition:width .2s}
.lane.hit span:first-child{color:var(--hot)}

/* 좁은 창(통째 축소가 큰 경우): 기준판 글자를 키워 실제로 읽히게, 줄 수는 줄어듦 */
.compact .feed{font-size:17px;line-height:24px}
.compact table,.compact .lane{font-size:16px}
.compact .lane{grid-template-columns:minmax(0,1fr) 80px}
.compact .p h2{font-size:15px}.compact .p h2 em{display:none}
.compact .res{font-size:17px}.compact .res h3{font-size:28px}.compact .res .tag,.compact .res .badge,.compact .res .ev{font-size:15px}
.compact .res .nums b{font-size:32px}
.compact .cnt b{font-size:20px}.compact .cnt div{font-size:13px}
.compact .site{font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>BARUN APARTMENT ENGINE / MASSING LAB<small id="sub"></small></h1>
    <div class="cnt" id="cnt"></div>
    <div class="speed">재생 <span id="speeds" style="display:flex;gap:4px"></span></div>
  </header>

  <section class="hero">
    <canvas id="hero"></canvas>
    <div class="site" id="site"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="grid">
    <div class="p"><h2>탐색 기록 <em>동 놓기 → 층 조정 → 교체 → 간격 이동 → 검사</em></h2><div class="feed" id="feed"></div></div>
    <div class="p"><h2>세대수 추이 <em><span style="color:var(--mint)">― 최고안</span> · <span style="color:var(--blue)">― 정림 계획</span></em></h2><canvas id="cTrace"></canvas></div>
    <div class="p"><h2>막힌 이유 <em>이 작업 · 실제 기록</em></h2><div id="lanes"></div></div>
    <div class="p"><h2>배치 평면 <em id="planTag"></em></h2><canvas id="cPlan"></canvas></div>

    <div class="p"><h2>탐색 작업 비교 <em id="jobsTag"></em></h2><canvas id="cJobs"></canvas></div>
    <div class="p"><h2>동별 표 <em id="dongTag"></em></h2><div id="dongs"></div></div>
    <div class="p"><h2>최종 검사 <em>탐색 뒤 독립 재검사</em></h2><div id="checks"></div></div>
    <div class="p"><h2>대지 조건 <em id="siteTag"></em></h2><div id="siteInfo"></div></div>
  </section>
</div>

<script>const EMBED = new URLSearchParams(location.search).get("embed") === "1";
if (!EMBED) document.write('<script src="apt_example.js"><\/script>');</script>
<script src="apartment-embed.js"></script>
<script>
if (!EMBED) {
const D = window.APT_RUN;
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => v == null ? "–" : (+v).toFixed(d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAL = {mint: "#A4E4CE", teal: "#70BFB8", cyan: "#75DDE8", blue: "#82AFFF", steel: "#8FB7CA", ai: "#CABBF1", green: "#79AD91", warn: "#F2CA89", err: "#E9A9AA", hot: "#FF727A", text: "#E8EEF5", glow: "#28465A"};
const K = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, hex(v)]));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const pad4 = n => String(n).padStart(4, "0");
function bbox(pts) { let a = [1e9, 1e9, -1e9, -1e9]; pts.forEach(([x, y]) => { a = [Math.min(a[0], x), Math.min(a[1], y), Math.max(a[2], x), Math.max(a[3], y)]; }); return a; }
const centroid = pts => { const b = bbox(pts); return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]; };
const WHY = {min_gap: "인동간격", daylight_2: "2호 채광(동지 일조)", daylight_1: "1호 채광(경계 높이)", in_piece: "대지 안", sunhours: "동지 일조 시간", mixed_form_order: "혼합 배치 순서"};
const why = w => WHY[w] || w;
const STO = D.storey;

let SPEED = 1;
const RATE = 5;                                   // 1×: 초당 배치 시도 5개(막힌 시도는 사이에 빠르게)
$("sub").textContent = `연산동 586-3 · 시나리오 ${D.scenario} · 엔진 ${D.seconds}s 기록 · 탐색 작업 ${D.jobs.length}개 중 최종안 작업 재생`;
$("speeds").innerHTML = [1, 2, 4].map(v => `<button data-v="${v}">${v}×</button>`).join("");
$("speeds").querySelectorAll("button").forEach(b => b.onclick = () => { SPEED = +b.dataset.v; $("speeds").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
$("speeds").firstChild.classList.add("on");

/* ---------- 한 화면 맞춤 ---------- */
let SCALE = 1;
function fitApp() {
  const H = clamp(1600 * innerHeight / innerWidth, 900, 1000), app = document.querySelector(".app");
  SCALE = Math.min(innerWidth / 1600, innerHeight / H);
  document.body.classList.toggle("compact", SCALE < .75);
  app.style.setProperty("--H", H + "px");
  app.style.transform = `translate(${(innerWidth - 1600 * SCALE) / 2}px,${(innerHeight - H * SCALE) / 2}px) scale(${SCALE})`;
}
function fitCanvas(cv) { const r = (devicePixelRatio || 1) * Math.max(SCALE, .5), w = cv.clientWidth, h = cv.clientHeight; cv.width = Math.max(1, w * r); cv.height = Math.max(1, h * r); cv.getContext("2d").setTransform(r, 0, 0, r, 0, 0); return [w, h]; }
function sub(id) { const cv = $(id), w = cv.clientWidth, h = cv.clientHeight, c = cv.getContext("2d"); c.clearRect(0, 0, w, h); return [w, h, c]; }

/* ---------- 단계: 법규 → 대지 → 인센티브 → 목표 → 배치 탐색 → 재검사 → 결과 ---------- */
const F = D.flow;
const PH = [["law", "법규 검토", 3.4], ["site", "대지면적 확정", 2.4], ["inc", "인센티브 최대", 3.8], ["target", "목표 산정", 2.4], ["run", "배치 탐색", 0], ["verify", "독립 재검사", 3.0], ["final", "결과", 0]];
const PHI = Object.fromEntries(PH.map((p, i) => [p[0], i]));
const ZCOL = z => /준주거/.test(z) ? K.ai : /상업/.test(z) ? K.warn : K.green;
const wFar = F ? F.pieces.reduce((a, p) => a + p.area * p.far_max, 0) / F.pieces.reduce((a, p) => a + p.area, 0) : null;
const tgt = (D.plans[0].program || {}).target || {};
function drawPhaseStrip() {
  let x = MODEL.x; const y = 50, cur = PHI[S.phase];
  PH.forEach(([id, name], i) => {
    const done = i < cur, on = i === cur, t = `${"①②③④⑤⑥⑦"[i]} ${name}`;
    g.font = `${on ? 600 : 400} 12px 'Barun Drawing Korean', sans-serif`; const w = g.measureText(t).width;
    if (on) { g.fillStyle = rgba(K.cyan, .16); g.fillRect(x - 6, y - 14, w + 12, 20); g.fillStyle = rgba(K.cyan, 1); g.fillRect(x - 6, y + 5, (w + 12) * (S.phase === "run" ? Math.max(0, S.si + 1) / SCORES.length : clamp(S.pt / (PH[i][2] || 1), 0, 1)), 2); }
    g.fillStyle = on ? rgba(K.text, 1) : done ? rgba(K.mint, .9) : rgba(K.steel, .45); g.fillText(t, x, y);
    x += w + 22; if (i < PH.length - 1) { g.fillStyle = rgba(K.steel, .35); g.fillText("→", x - 16, y); }
  });
}
function drawPieces(a, lab, hOf) {
  if (!F) return;
  (F.roads || []).forEach(r => { path(g, r); g.fillStyle = rgba(K.blue, .06 * a); g.fill(); g.strokeStyle = rgba(K.blue, .25 * a); g.lineWidth = 1; g.stroke(); });
  F.pieces.forEach(p => {
    const col = ZCOL(p.zone), h = hOf ? hOf(p) : 0;
    path(g, p.poly); g.fillStyle = rgba(col, .14 * a); g.fill(); g.strokeStyle = rgba(col, .8 * a); g.lineWidth = 1.4; g.stroke();
    if (h > .1) { prism(p.poly.concat([p.poly[0]]), h, col, .8 * a, false); }
    if (lab) { const c = centroid(p.poly), [X, Y] = P(...c, h); g.font = "600 12px 'Barun Drawing Korean', sans-serif"; const t1 = `${p.zone} · ${fmt(p.area, 1)}㎡`, t2 = lab(p);
      const w = Math.max(g.measureText(t1).width, g.measureText(t2).width) + 14; g.fillStyle = "rgba(22,26,33,.88)"; g.fillRect(X - w / 2, Y - 34, w, 38); g.fillStyle = rgba(col, 1); g.fillRect(X - w / 2, Y - 34, 2, 38);
      g.fillText(t1, X - w / 2 + 8, Y - 18); g.font = "11px Consolas, Menlo, monospace"; g.fillStyle = rgba(K.text, .85); g.fillText(t2, X - w / 2 + 8, Y - 2); }
  });
}
const FARH = .15;                                  // 용적 기둥 높이 = 용적률 × 0.2m (보기용)
let preAt = -1;
function drawPre() {
  const p = clamp(S.pt / PH[PHI[S.phase]][2], 0, 1);
  if (S.phase === "law") {
    drawPieces(1, q => `법정 건폐 ${q.bcr}% · 용적 ${q.far}% · 높이 ${q.height}m`);
    const y = MODEL.y + MODEL.h * (.15 + .7 * ((S.pt * 1.3) % 1)); g.strokeStyle = rgba(K.cyan, .5); g.lineWidth = 1; g.beginPath(); g.moveTo(MODEL.x, y); g.lineTo(MODEL.x + MODEL.w, y); g.stroke();
    const n = Math.floor(p * F.law_items.length); while (S.lawN < n) { const it = F.law_items[S.lawN++]; feed(`  <span class="m">✓</span> ${it.id} · ${it.art.slice(0, 34)}`); }
  } else if (S.phase === "site") {
    drawPieces(1, q => `조각 ${q.no} · ${fmt(q.area / F.pieces.reduce((a, b) => a + b.area, 0) * 100, 1)}%`);
    path(g, D.site); g.save(); g.setLineDash([8, 6]); g.lineDashOffset = -RT * 30; g.strokeStyle = rgba(K.text, 1); g.lineWidth = 2; g.stroke(); g.restore();
  } else if (S.phase === "inc") {
    const k = easeOut(clamp(p * 1.25, 0, 1));
    drawPieces(1, q => `용적 ${q.far}% → ${fmt(lerp(q.far, q.far_max, k), 0)}%`, q => lerp(q.far, q.far_max, k) * FARH);
    if (p > .8) { const top = (D.flow.scenario.district_plan || {}).far_pct || 0; const a = (p - .8) / .2; F.pieces.forEach(q => { path(g, q.poly, top * FARH); g.fillStyle = rgba(K.warn, .08 * a); g.fill(); g.strokeStyle = rgba(K.warn, .9 * a); g.setLineDash([6, 4]); g.lineWidth = 1.4; g.stroke(); g.setLineDash([]); });
      const q = P(...centroid(F.pieces[1].poly), top * FARH); g.font = "600 12px 'Barun Drawing Korean', sans-serif"; g.fillStyle = rgba(K.warn, a); g.fillText(`지구단위 상향 ${top}% (정림 조건)`, q[0] + 30, q[1] - 10); }
  } else if (S.phase === "target") {
    drawPieces(.6, null);
    const H = Math.min(F.scenario.height_cap_m || 145, S.maxH * 1.1) * easeOut(p);
    path(g, D.site, H); g.fillStyle = rgba(K.cyan, .06); g.fill(); g.strokeStyle = rgba(K.cyan, .8); g.setLineDash([6, 4]); g.lineWidth = 1.2; g.stroke(); g.setLineDash([]);
    D.site.forEach(v => { g.strokeStyle = rgba(K.cyan, .25); g.beginPath(); g.moveTo(...P(...v, 0)); g.lineTo(...P(...v, H)); g.stroke(); });
    const q = D.site.reduce((m, v) => { const w = P(...v, H); return w[0] < m[0] ? w : m; }, [1e9, 0]); q[1] = Math.max(q[1], 90); g.font = "600 12px 'Barun Drawing Korean', sans-serif"; g.fillStyle = rgba(K.cyan, 1); g.fillText(`높이 상한 ${F.scenario.height_cap_m}m · 최고 ${F.scenario.floors_max}층`, q[0] + 10, q[1] - 8);
  }
  if (RT - preAt > .1) { preAt = RT; preRes(p); }
}
function preRes(p) {
  const r = $("res");
  if (S.phase === "law") {
    const n = Math.floor(p * F.law_items.length), list = F.law_items.slice(Math.max(0, n - 8), n);
    r.className = "res"; r.innerHTML = `<div class="tag">① 법규 검토 · 아파트 법령 규칙표(법제처 원문 대조)</div><div class="badge"><i></i>규칙 ${n}/${F.law_items.length} 확인</div>
      <h3>${F.pieces.map(q => q.zone).join(" + ")}</h3><div class="sub">${F.pieces.map(q => `${q.zone} 건폐 ${q.bcr}% · 용적 ${q.far}%`).join("<br>")}</div>
      <ul style="margin-top:10px">${list.map(it => `<li class="plain" style="list-style:none"><span style="color:var(--mint)">✓</span> <b style="font-weight:600">${it.id}</b> <span style="color:var(--dim)">${it.art.slice(0, 26)}</span></li>`).join("")}</ul>`;
  } else if (S.phase === "site") {
    const tot = F.pieces.reduce((a, q) => a + q.area, 0), k = easeOut(p);

}

  c.strokeStyle = rgba(K.blue, .8); c.setLineDash([4, 3]); c.beginPath(); c.moveTo(30, Y(D.ref.units)); c.lineTo(w, Y(D.ref.units)); c.stroke(); c.setLineDash([]);
  const upto = ["verify", "final"].includes(S.phase) ? 1e9 : S.si;
  SCORES.forEach(([s], k) => { if (k > upto) return; c.fillStyle = rgba(K.steel, .7); c.fillRect(X(k) - 1, Y(s.u) - 1, 2, 2); });
  let best = 0; c.strokeStyle = rgba(K.mint, .95); c.lineWidth = 1.5; c.beginPath(); let st = false;
  SCORES.forEach(([s], k) => { if (k > upto) return; if (s.u > best) best = s.u; st ? c.lineTo(X(k), Y(best)) : (c.moveTo(X(k), Y(best)), st = true); }); c.stroke(); c.lineWidth = 1;
  if (best) { c.fillStyle = rgba(K.mint, 1); c.fillText(`${best}세대`, Math.min(w - 50, X(Math.max(0, S.si)) + 4), Y(best) - 4); }
}
function drawPlan() {
  const cv = $("cPlan"); if (!cv.clientWidth) return; const [w, h, c] = sub("cPlan"), sb = bbox(D.site), s = Math.min((w - 16) / (sb[2] - sb[0]), (h - 12) / (sb[3] - sb[1])), ox = (w - (sb[2] - sb[0]) * s) / 2, oy = (h - (sb[3] - sb[1]) * s) / 2;
  const Tp = pts => { c.beginPath(); pts.forEach(([x, y], k) => { const X = ox + (x - sb[0]) * s, Y = oy + (sb[3] - y) * s; k ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); };
  Tp(D.site); c.strokeStyle = rgba(K.text, .8); c.setLineDash([4, 2]); c.stroke(); c.setLineDash([]);
  const fin = S.phase === "final", B = fin ? D.plans[0].buildings.map(b => ({p: b.p, c: b.block, f: b.floors})) : (S.cur ? S.cur.B : []);
  B.forEach(b => { if (!b.p) return; Tp(b.p); c.fillStyle = rgba(fin || S.cur === S.best ? K.mint : K.steel, .3); c.fill(); c.strokeStyle = rgba(fin || S.cur === S.best ? K.mint : K.steel, .95); c.stroke();
    const [x, y] = centroid(b.p); c.fillStyle = "#E8EEF5"; c.font = "10px Consolas, Menlo, monospace"; c.fillText(`${b.f}F`, ox + (x - sb[0]) * s - 8, oy + (sb[3] - y) * s + 3); });
  if (fin) D.plans[0].gaps.forEach(q => { c.strokeStyle = rgba(K.cyan, .9); c.setLineDash([3, 2]); c.beginPath(); q.seg.forEach(([x, y], k) => { const X = ox + (x - sb[0]) * s, Y = oy + (sb[3] - y) * s; k ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.stroke(); c.setLineDash([]); });
  $("planTag").textContent = fin ? "최종안 · 인동간격 선" : S.cur ? `시도 #${pad4(S.si + 1)}` : "";
}
function drawJobs() {
  const cv = $("cJobs"); if (!cv.clientWidth) return; const [w, h, c] = sub("cJobs"), forms = ["타워형", "판상형", "혼합형"], col = {타워형: K.mint, 판상형: K.cyan, 혼합형: K.ai};
  const J = D.jobs.slice().sort((a, b) => forms.indexOf(a.form) - forms.indexOf(b.form) || b.fill - a.fill), bw = (w - 10) / J.length;
  J.forEach((j, k) => { const hh = (h - 22) * j.fill / 100, x = 5 + k * bw; c.fillStyle = rgba(col[j.form] || K.steel, j.win ? 1 : .45); c.fillRect(x, h - 14 - hh, Math.max(1, bw - 1), hh); if (j.win) { c.strokeStyle = rgba(K.text, 1); c.strokeRect(x - 1, h - 15 - hh, bw + 1, hh + 2); } });
  c.font = "10px Consolas, Menlo, monospace"; let x = 5; forms.forEach(f => { const n = J.filter(j => j.form === f).length; c.fillStyle = rgba(col[f], 1); c.fillText(`${f} ${n}`, x, h - 2); x += n * bw; });
  $("jobsTag").textContent = `${D.jobs.length}개 · 막대 = 용적 채움 · 흰 테 = 최종안 작업`;
}

const Q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  fitApp(); start();
  const k = +Q.get("k") || 0; if (k) { S.phase = "run"; while (S.si + 1 < k && S.phase === "run") advance(); }
  const ph = Q.get("ph");
  if (ph === "verify") { S.phase = "run"; while (S.phase === "run") advance(); S.pt = (+Q.get("t") || 0); }
  else if (ph && PHI[ph] != null) { S.phase = ph; S.pt = (+Q.get("t") || 0); }
  if (Q.get("fin")) { S.phase = "run"; while (S.phase === "run") advance(); S.phase = "final"; S.fin = 2; showRes(); checks(); }
  requestAnimationFrame(frame);
});

/* ---------- 캐드에서 끼워 쓰기: 조종 메시지 · 진행 알림 ----------
   iframe.contentWindow.postMessage({target: "barun-wait", cmd: "pause"|"resume"|"restart"|"speed", value}, "*")
   알림: window.parent 로 {source: "barun-wait", kind: "apartment", event: "phase"|"done", ...} */
let PAUSED = false, _lastPhase = "";
function post(ev, extra = {}) { try { if (parent !== window) parent.postMessage({source: "barun-wait", kind: "apartment", event: ev, ...extra}, "*"); } catch (e) {} }
setInterval(() => { if (typeof S !== "undefined" && S.phase && S.phase !== _lastPhase) { _lastPhase = S.phase; post(S.phase === "final" ? "done" : "phase", {phase: S.phase}); } }, 200);
addEventListener("message", ev => { const m = ev.data || {}; if (m.target !== "barun-wait") return;
  if (m.cmd === "pause") PAUSED = true; if (m.cmd === "resume") { PAUSED = false; last = 0; } if (m.cmd === "speed") SPEED = +m.value || 1;
  if (m.cmd === "restart") { PAUSED = false; start(); } });
if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
}
