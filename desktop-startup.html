<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
 <title>바른 CAD 준비 중</title>
 <style>
  html,body{margin:0;width:100%;height:100%;background:#25292f;color:#e8edf2;font:14px "Malgun Gothic",Arial,sans-serif}
  main{box-sizing:border-box;height:100%;padding:28px 30px;border:1px solid #3b4650;display:flex;flex-direction:column;justify-content:center}
  h1{font-size:20px;font-weight:600;margin:0 0 20px;color:#9dcbe0;text-wrap:balance}
  p{margin:0 0 12px;text-wrap:pretty}
  #elapsed{font-variant-numeric:tabular-nums;color:#b8c3cc}
  small{margin-top:10px;color:#aeb8c1;font-size:12px}
 </style>
</head>
<body>
 <main>
  <h1>바른 CAD를 준비하고 있습니다</h1>
  <p id="phase" role="status" aria-live="polite">실행 환경을 확인하고 있습니다.</p>
  <p id="elapsed">경과 0초</p>
  <small>준비가 끝나면 도면 화면이 열립니다.</small>
 </main>
 <script>
  let latest={phase:"실행 환경을 확인하고 있습니다.",elapsedMs:0,receivedAt:Date.now()};
  let timer=0;
  function render(){
   document.getElementById("phase").textContent=latest.phase;
   document.getElementById("elapsed").textContent="경과 "+Math.max(0,Math.floor((latest.elapsedMs+Date.now()-latest.receivedAt)/1000))+"초";
  }
  window.startupStatus=function(s){
   latest={...latest,...s,receivedAt:Date.now()};
   if(!document.hidden)render();
  };
  function resume(){if(timer)return;render();timer=setInterval(render,1000);}
  function pause(){clearInterval(timer);timer=0;}
  document.addEventListener("visibilitychange",()=>document.hidden?pause():resume());
  if(!document.hidden)resume();
  window.addEventListener("pagehide",pause);
 </script>
</body>
</html>
